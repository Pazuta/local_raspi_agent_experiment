<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raspberry Pi Chatbot</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; background: #f4f1ea; color: #25231f; }
    main { background: #fffdf8; border: 1px solid #d9d1c3; padding: 1.25rem; border-radius: 8px; }
    h1 { margin-top: 0; }
    #messages { min-height: 240px; max-height: 55vh; overflow-y: auto; padding: .5rem; border: 1px solid #ddd5c8; border-radius: 6px; background: #faf8f2; }
    .message { margin: .7rem 0; white-space: pre-wrap; }
    .user { color: #155e75; }
    .assistant { color: #31572c; }
    form { display: flex; gap: .6rem; margin-top: 1rem; }
    input { flex: 1; min-width: 0; padding: .75rem; border: 1px solid #aaa093; border-radius: 5px; font: inherit; }
    button { padding: .75rem 1rem; border: 0; border-radius: 5px; background: #155e75; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { color: #6b6258; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Raspberry Pi Chatbot</h1>
    <p id="status">Local model service</p>
    <section id="messages" aria-live="polite"></section>
    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="Ask something..." required maxlength="4000">
      <button type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message");
    const messages = document.querySelector("#messages");
    const button = form.querySelector("button");

    function addMessage(role, text) {
      const element = document.createElement("div");
      element.className = `message ${role}`;
      element.textContent = `${role === "user" ? "You" : "Bot"}: ${text}`;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage("user", message);
      input.value = "";
      button.disabled = true;
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        addMessage("assistant", response.ok ? data.reply : data.error);
      } catch (error) {
        addMessage("assistant", "The chatbot service could not be reached.");
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
